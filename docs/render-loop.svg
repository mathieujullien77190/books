<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Boucle de rendu et modes léger / complet</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a37"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="#ffffff"/>

  <!-- boucle -->
  <text x="30" y="34" font-size="15" font-weight="700" fill="#1f2a37">Boucle tick() (requestAnimationFrame)</text>
  <g stroke="#1f2a37" stroke-width="1.5" fill="#ffffff">
    <rect x="30" y="50" width="330" height="74" rx="9"/>
    <rect x="30" y="156" width="330" height="74" rx="9"/>
    <rect x="30" y="262" width="330" height="74" rx="9"/>
    <rect x="30" y="368" width="330" height="62" rx="9" fill="#fff7ec" stroke="#b5651d"/>
    <rect x="30" y="480" width="330" height="74" rx="9" fill="#eaf5ea" stroke="#4a8a4a"/>
    <rect x="30" y="584" width="330" height="62" rx="9"/>
  </g>
  <g font-size="13.5" font-weight="700" fill="#1f2a37">
    <text x="46" y="76">1. Animations</text>
    <text x="46" y="182">2. Livres en mouvement</text>
    <text x="46" y="288">3. Caméra</text>
    <text x="46" y="394">4. Faut-il redessiner ?</text>
    <text x="46" y="506">5. Rendu</text>
    <text x="46" y="610">6. Suite</text>
  </g>
  <g font-size="12" fill="#5b6b7c">
    <text x="46" y="96">livre sorti et voisins (Showcase), caméra du tas</text>
    <text x="46" y="112">de manquants, mésange (decor.update)</text>
    <text x="46" y="202">chaque livre rejoint sa cible par interpolation</text>
    <text x="46" y="218">(position, rotation, taille) : mouvement ⇒ dirty</text>
    <text x="46" y="308">controls.update() (amortissement) ; la caméra ne</text>
    <text x="46" y="324">passe jamais sous le sol ; étiquette de la mésange</text>
    <text x="46" y="414">dirty : non ⇒ on saute le rendu de cette image</text>
    <text x="46" y="530">ombres recalculées seulement si shadowDirty ;</text>
    <text x="46" y="546">passe 0 : scène ; passe 1 : livre sorti par-dessus</text>
    <text x="46" y="630">requestAnimationFrame(tick)</text>
  </g>
  <g stroke="#1f2a37" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M195 124 V156"/>
    <path d="M195 230 V262"/>
    <path d="M195 336 V368"/>
    <path d="M195 430 V480"/>
    <path d="M195 554 V584"/>
    <path d="M360 399 H400 V615 H360"/>
  </g>
  <text x="206" y="460" font-size="12" fill="#1f2a37">oui</text>
  <text x="368" y="392" font-size="12" fill="#1f2a37">non</text>

  <!-- causes -->
  <rect x="420" y="50" width="550" height="290" rx="12" fill="#f3f7fb" stroke="#9db3c8" stroke-width="1.5"/>
  <text x="440" y="78" font-size="14" font-weight="700" fill="#1f2a37">Ce qui marque la scène « à redessiner » (dirty)</text>
  <g font-size="12.5" fill="#1f2a37">
    <text x="440" y="106">• événement `change` des contrôles (caméra, amortissement)</text>
    <text x="440" y="130">• emit() : tout changement d'état (caisse, livre, sélection, mode)</text>
    <text x="440" y="154">• redimensionnement du canvas</text>
    <text x="440" y="178">• événements pointeur, molette et clavier</text>
    <text x="440" y="202">• couverture d'un livre qui finit de se charger</text>
    <text x="440" y="226">• livre encore en mouvement (étape 2)</text>
    <text x="440" y="250">• mésange visible : une image toutes les 50 ms (≈ 20 i/s)</text>
  </g>
  <text x="440" y="284" font-size="12.5" font-weight="700" fill="#1f2a37">Les ombres sont statiques</text>
  <text x="440" y="304" font-size="12" fill="#5b6b7c">shadowMap.autoUpdate = false ; touch() active shadowDirty, la mésange seule non.</text>
  <text x="440" y="322" font-size="12" fill="#5b6b7c">Une scène immobile ne coûte plus de GPU (hors mésange).</text>

  <!-- modes -->
  <rect x="420" y="368" width="550" height="330" rx="12" fill="#fff7ec" stroke="#b5651d" stroke-width="1.5"/>
  <text x="440" y="396" font-size="14" font-weight="700" fill="#1f2a37">Modes d'affichage : léger puis complet</text>

  <rect x="440" y="412" width="230" height="110" rx="9" fill="#ffffff" stroke="#1f2a37"/>
  <text x="555" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a37">Léger</text>
  <g font-size="12" fill="#1f2a37" text-anchor="middle">
    <text x="555" y="458">livres = pavés d'une couleur</text>
    <text x="555" y="476">sans caisses ni mésange</text>
    <text x="555" y="494">sans ombres, sans textures</text>
    <text x="555" y="512">le livre sorti garde ses faces</text>
  </g>
  <rect x="730" y="412" width="220" height="110" rx="9" fill="#ffffff" stroke="#1f2a37"/>
  <text x="840" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a37">Complet</text>
  <g font-size="12" fill="#1f2a37" text-anchor="middle">
    <text x="840" y="458">dos dessinés (canvas)</text>
    <text x="840" y="476">caisses, mésange, ombres</text>
    <text x="840" y="494">couvertures chargées à la</text>
    <text x="840" y="512">demande (livre couché, sorti)</text>
  </g>
  <path d="M670 467 H730" stroke="#1f2a37" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="700" y="459" font-size="11.5" text-anchor="middle" fill="#1f2a37">upgrade</text>

  <g font-size="12" fill="#1f2a37">
    <text x="440" y="552" font-weight="700">Au chargement</text>
    <text x="440" y="572">1. restore en mode léger, warm-up GPU (shaders, textures) derrière l'indicateur</text>
    <text x="440" y="590">2. upgradeToFull() : dos refaits par lots de 12 livres toutes les 16 ms</text>
    <text x="440" y="608">3. puis caisses, mésange et ombres, refresh() final</text>
    <text x="440" y="636" font-weight="700">Bouton « Mode léger »</text>
    <text x="440" y="656">setLite(on) mémorise le choix (localStorage « lite-mode »), interrompt la</text>
    <text x="440" y="674">montée en cours et bascule d'un bloc (applyMode). Choix léger : pas de montée.</text>
  </g>
</svg>
